# Bonus: 2-node scotch + NUMA + collated + MPI ring allreduce
# ring allreduce (algorithm 6) over InfiniBand HDR should reduce
# collective latency vs default binary tree at 208 ranks cross-node.
VARIANT_NAME="scotch_r208_numa_mpi"
DECOMPOSITION_METHOD="scotch"
HIERARCHICAL_COEFFS=""
MPI_EXTRA_FLAGS="--map-by socket --bind-to core --mca coll_tuned_use_dynamic_rules 1 --mca coll_tuned_allreduce_algorithm 6"
OF_EXTRA_FLAGS="-fileHandler collated"
