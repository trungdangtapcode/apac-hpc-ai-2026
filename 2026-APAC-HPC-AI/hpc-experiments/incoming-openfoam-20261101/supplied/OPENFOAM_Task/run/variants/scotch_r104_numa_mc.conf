# scotch r104 + NUMA binding + masterCoarsest processorAgglomerator
# Bonus tier: moves coarsest-level GAMG work to 1 master rank,
# eliminates ~72 latency-dominated MPI_Allreduce per step.
# Requires self-proof: Cd within +/-0.5% of scotch_r104_numa baseline.
# Baseline Cd@step40 = 0.4326 → accept range: 0.4304 to 0.4348
VARIANT_NAME="scotch_r104_numa_mc"
DECOMPOSITION_METHOD="scotch"
HIERARCHICAL_COEFFS=""
MPI_EXTRA_FLAGS="--map-by socket --bind-to core"
FVSOLUTION_VARIANT="masterCoarsest"
