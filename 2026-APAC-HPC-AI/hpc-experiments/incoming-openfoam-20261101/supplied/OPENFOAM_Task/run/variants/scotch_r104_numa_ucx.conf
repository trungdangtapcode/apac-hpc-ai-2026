# scotch r104 + NUMA binding + OpenMPI shared memory transport
# Combined: eliminates cross-socket latency AND forces optimal intra-node
# MPI transport using OpenMPI native BTL (not UCX which breaks on Gadi).
VARIANT_NAME="scotch_r104_numa_ucx"
DECOMPOSITION_METHOD="scotch"
HIERARCHICAL_COEFFS=""
MPI_EXTRA_FLAGS="--map-by socket --bind-to core --mca btl self,vader"
