# 4-node final run: scotch + NUMA binding (104 ranks/node x 4 nodes = 416)
# Best proven config from 1-node and 2-node scaling study.
# NUMA binding: --map-by socket --bind-to core
# 52 ranks/socket x 2 sockets/node x 4 nodes = 416 ranks total
# collated fileHandler: reduce Lustre metadata overhead at 416 ranks
VARIANT_NAME="scotch_r416_numa"
DECOMPOSITION_METHOD="scotch"
HIERARCHICAL_COEFFS=""
MPI_EXTRA_FLAGS="--map-by socket --bind-to core"
OF_EXTRA_FLAGS="-fileHandler collated"
