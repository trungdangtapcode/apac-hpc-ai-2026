# Bonus: scotch r104 + NUMA + fvSolution.fixedTol
# Same MPI config as scotch_r104_numa (Basic best), but switches fvSolution
# from fixedIter (maxIter=12/15/8, tolerance=0) to fixedTol (tolerance-based
# early exit). GAMG p solver exits when residual < 1e-7 or relTol < 0.01 —
# from 4-node log analysis, this fires at ~6-8 iters vs fixed 12.
# Bonus tier only — fvSolution change disqualifies from Basic scoring.
VARIANT_NAME="scotch_r104_numa_ftol"
DECOMPOSITION_METHOD="scotch"
HIERARCHICAL_COEFFS=""
MPI_EXTRA_FLAGS="--map-by socket --bind-to core"
FVSOLUTION_VARIANT="fixedTol"
