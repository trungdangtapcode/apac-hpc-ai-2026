# Bonus: scotch r104 + NUMA + MPI collective tuning
# Ring allreduce (algorithm 6) reduces latency for many-rank collectives
# vs default binary tree. On 1-node shared memory this has no effect —
# OpenMPI uses sm transport regardless. Effect shows at 2+ nodes over IB.
# fvSolution: fixedIter (unchanged) -> Cd bit-identical, F3 auto-pass on 1-node.
VARIANT_NAME="scotch_r104_numa_mpi"
DECOMPOSITION_METHOD="scotch"
HIERARCHICAL_COEFFS=""
MPI_EXTRA_FLAGS="--map-by socket --bind-to core --mca coll_tuned_use_dynamic_rules 1 --mca coll_tuned_allreduce_algorithm 6"
