# scotch r104 + NUMA binding (--map-by socket --bind-to core)
# Theory: 104 ranks across 2 SPR sockets = 52 ranks/socket
# Binding each rank to a physical core eliminates cross-socket memory latency.
# Expected: reduce memory wait time T_memory_wait by keeping rank's working
# set on the same NUMA domain as its allocated cores.
VARIANT_NAME="scotch_r104_numa"
DECOMPOSITION_METHOD="scotch"
HIERARCHICAL_COEFFS=""
MPI_EXTRA_FLAGS="--map-by socket --bind-to core"
