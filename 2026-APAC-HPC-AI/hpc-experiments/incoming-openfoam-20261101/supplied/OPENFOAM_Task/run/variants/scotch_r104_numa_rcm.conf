# Bonus: scotch r104 + NUMA + Reverse Cuthill-McKee renumbering
# Same as scotch_r104_numa but adds -dict flag to renumberMesh,
# which picks up system/renumberMeshDict and applies RCM reordering.
# RCM minimises matrix bandwidth → better cache locality in fvMatrix loops.
VARIANT_NAME="scotch_r104_numa_rcm"
DECOMPOSITION_METHOD="scotch"
HIERARCHICAL_COEFFS=""
MPI_EXTRA_FLAGS="--map-by socket --bind-to core"
RENUMBER_DICT_FLAG=""
