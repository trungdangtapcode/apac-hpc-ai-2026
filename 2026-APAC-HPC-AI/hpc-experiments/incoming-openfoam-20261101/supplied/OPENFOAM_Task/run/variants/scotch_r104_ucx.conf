# scotch r104 + OpenMPI shared memory transport (intra-node only)
# Fix: UCX_TLS=sm breaks PMIx on Gadi OpenMPI 4.1.7
# Use OpenMPI native BTL instead: vader (shared memory) + self
# --mca btl self,vader forces pure shared-memory path, no IB stack overhead
VARIANT_NAME="scotch_r104_ucx"
DECOMPOSITION_METHOD="scotch"
HIERARCHICAL_COEFFS=""
MPI_EXTRA_FLAGS="--mca btl self,vader"
