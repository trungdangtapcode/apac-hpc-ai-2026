   </g>
   <g id="text_6">
    <text style="font: 9.6px 'DejaVu Sans'" transform="translate(555.53475 176.142435)">Same-node H then Scotch</text>
    <text style="font: 9.6px 'DejaVu Sans'" transform="translate(548.48025 189.080685)">0.994% observed gain, noisy</text>
   </g>
   <g id="text_7">
    <text style="font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="813.456" y="150.749432" transform="rotate(-0 813.456 150.749432)">21 Oct — locality hypothesis</text>
   </g>
   <g id="text_8">
    <text style="font: 9.6px 'DejaVu Sans'" transform="translate(749.38725 176.142435)">NUMA-aware Scotch graph</text>
    <text style="font: 9.6px 'DejaVu Sans'" transform="translate(744.492 189.080685)">10.63% fewer crossing faces</text>
   </g>
   <g id="text_9">
    <text style="font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="813.456" y="314.408312" transform="rotate(-0 813.456 314.408312)">22 Oct — hypothesis loses</text>
   </g>
   <g id="text_10">
