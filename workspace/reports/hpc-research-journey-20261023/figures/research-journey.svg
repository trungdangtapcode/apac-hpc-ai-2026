   <g id="text_3">
    <text style="font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="422.856" y="150.788495" transform="rotate(-0 422.856 150.788495)">21 Oct — native baseline</text>
   </g>
   <g id="text_4">
    <text style="font: 9.6px 'DejaVu Sans'" transform="translate(346.04775 176.142435)">Hierarchical, 1 node / 128 ranks</text>
    <text style="font: 9.6px 'DejaVu Sans'" transform="translate(363.507 189.080685)">14.922 seconds per step</text>
   </g>
   <g id="text_5">
